<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>HyperKart</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🏎️</text></svg>" />
    <style>
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #05070d; }
      body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      #app { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      /* `contain` walls the HUD off from the rest of the document: it updates
         every rendered frame, and without this a text change inside it can
         dirty layout for the whole page. */
      #ui { position: fixed; inset: 0; pointer-events: none; z-index: 10; contain: layout style; }
      #ui .clickable { pointer-events: auto; }
      /* The HUD is deliberately animation-heavy. Honour the OS preference by
         collapsing every flourish to an instant state change — the readouts
         still update, they just stop moving. */
      @media (prefers-reduced-motion: reduce) {
        #ui *, #ui *::before, #ui *::after {
          animation-duration: 1ms !important; animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
